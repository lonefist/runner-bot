name: Runner Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Only ONE Runner Bot workflow is allowed to run at a time.
concurrency:
  group: runner-bot
  cancel-in-progress: true

jobs:
  runner-bot:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HEATING_ALERTS_ENABLED: "true"
      SCAN_INTERVAL_SECONDS: "15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Runner Bot
        run: |
          python3 -u bot.py
