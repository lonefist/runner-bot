name: Runner Bot V6.1
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
permissions:
  contents: read
concurrency:
  group: runner-bot
  cancel-in-progress: false
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show repository files
        run: |
          echo "Repository root:"
          pwd
          echo "Files:"
          find . -maxdepth 4 -type f \
            -not -path './.git/*' | sort
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Find bot.py
        id: find_bot
        run: |
          if [ -f "telegram_bot/bot.py" ]; then
            echo "bot_path=telegram_bot/bot.py" >> "$GITHUB_OUTPUT"
          elif [ -f "bot.py" ]; then
            echo "bot_path=bot.py" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: bot.py was not found."
            echo "Check the repository file listing above."
            exit 1
          fi
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUNNER_STATE_FILE: runner_state_v61.json
        run: |
          python -u "${{ steps.find_bot.outputs.bot_path }}"
