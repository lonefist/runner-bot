name: Runner Engine V6.0
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
concurrency:
  group: runner-engine-v6
  cancel-in-progress: false
jobs:
  runner-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate bot file
        id: locate
        shell: bash
        run: |
          if [ -f "telegram_bot/bot.py" ]; then
            echo "script=telegram_bot/bot.py" >> "$GITHUB_OUTPUT"
          elif [ -f "bot.py" ]; then
            echo "script=bot.py" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Could not find bot.py"
            exit 1
          fi
      - name: Run Runner Bot V6.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCAN_INTERVAL_SECONDS: "15"
          DISCOVERY_INTERVAL_SECONDS: "60"
          HEATING_ALERTS_ENABLED: "true"
          PYTHONUNBUFFERED: "1"
        run: python "${{ steps.locate.outputs.script }}"
